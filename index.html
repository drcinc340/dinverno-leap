<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dinverno Leap" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dinverno Remodeling | Leap CRM</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #1b222c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
    .spinner { width: 42px; height: 42px; border: 4px solid rgba(51,122,183,0.3); border-top-color: #337ab7; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div style="font-weight:800;font-size:16px;letter-spacing:0.5px;">DINVERNO REMODELING &amp; CONSTRUCTION</div>
    <div style="font-size:12px;color:#94a3b8;margin-top:6px;">Connecting to Private Leap CRM Server...</div>
  </div>
  <script>
    (async () => {
      const qs = window.location.search || '';
      const isIPhone = /iPhone|iPod/i.test(navigator.userAgent) || qs.includes('iphone');
      try {
        const res = await fetch('./live_url.json?t=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        const base = (data.tunnelUrl || 'https://frederick-necessarily-assembly-printer.trycloudflare.com').replace(/\/+$/, '');
        window.location.replace(isIPhone ? (base + '/?mode=iphone') : (base + '/' + qs));
      } catch (e) {
        window.location.replace(isIPhone ? 'https://frederick-necessarily-assembly-printer.trycloudflare.com/?mode=iphone' : 'https://frederick-necessarily-assembly-printer.trycloudflare.com/');
      }
    })();
  </script>
</body>
</html>
